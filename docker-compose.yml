services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unyx-knowledge-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unyx}
      POSTGRES_USER: ${POSTGRES_USER:-unyx_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Guayaquil}

    command:
      - "postgres"
      - "-c"
      - "fsync=on"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "full_page_writes=on"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups

    networks:
      - unyx-db-admin
      - unyx-ai

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-unyx_admin} -d ${POSTGRES_DB:-unyx}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: unyx-knowledge-data

networks:
  unyx-db-admin:
    external: true

  unyx-ai:
    external: true